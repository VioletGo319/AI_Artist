timezone: America/New_York
generation:
  backend: flux3
  count: 8
  # Scheduled jobs continue until the time budget, not until eight images.
  mode: time_budget
  max_candidates: 256  # Defensive ceiling; the 30-minute time limit normally wins.
  creative_direction: ethereal
  # Official PUP weights/system prompt; CUDA 12 compatibility runner, not vLLM.
  upsampler_backend: transformers
  cleanup_seconds: 60
  aspect_ratios: ["3:2", "16:9", "1:1", "9:16"]
  cpu_offload: true
  upsampler_memory: 0.86
  duplicate_distance: 3
  aesthetic_score: false
  diffusers_model: Tongyi-MAI/Z-Image-Turbo
  diffusers_steps: 9
  diffusers_guidance: 0.0
  # Set a repository approval only when overriding the Apache-2.0 default.
  diffusers_license_approved: false
preference:
  exploration: 0.30
scheduler:
  # Production runs on one authorized HPC A100; never fall back to a local GPU.
  mode: slurm
  start_hour: 8
  runtime_minutes: 30
  admission_minutes: 10
  # A second attempt is allowed only after accounting proves zero allocation.
  max_submissions: 2
  cpus: 8
  memory: 64G
mail:
  retries: 3
  reply_days: 30
  # Only turn off for a documented private transport with equivalent authentication.
  require_dmarc: true
publish:
  remote: origin
  branch: main
retention:
  enabled: true
  site_url: https://xinyuwang.net/AI_Artist/
  remote: true
