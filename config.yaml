timezone: America/New_York
generation:
  backend: flux3
  count: 8
  # Scheduled jobs continue until the time budget, not until eight images.
  mode: time_budget
  max_candidates: 256  # Defensive ceiling; the 30-minute time limit normally wins.
  creative_direction: vivid_fantasy
  cleanup_seconds: 60
  aspect_ratios: ["1:1"]
  cpu_offload: true
  upsampler_memory: 0.86
  duplicate_distance: 3
  aesthetic_score: false
  diffusers_model: Tongyi-MAI/Z-Image-Turbo
  diffusers_steps: 9
  diffusers_guidance: 0.0
  # Set a repository approval only when overriding the Apache-2.0 default.
  diffusers_license_approved: false
preference:
  exploration: 0.30
scheduler:
  # Production runs on one authorized HPC A100; never fall back to a local GPU.
  mode: slurm
  start_hour: 8
  runtime_minutes: 30
  admission_minutes: 10
  cpus: 8
  memory: 64G
mail:
  retries: 3
  reply_days: 30
  # Only turn off for a documented private transport with equivalent authentication.
  require_dmarc: true
publish:
  remote: origin
  branch: main
