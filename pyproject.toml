[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "artcurator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "Pillow>=10.3,<13", "pydantic>=2.10,<3", "PyYAML>=6,<7", "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
gmail = ["google-api-python-client>=2,<3", "google-auth-oauthlib>=1.2,<2"]

[tool.setuptools.packages.find]
include = ["artcurator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
